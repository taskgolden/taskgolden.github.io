<html>
    <head>
        <meta http-equiv="content-type" content="text/html; charset=UTF-8"/>
        <title>64-in-1 53个不重复</title>    
    </head>
<body>
  
    <div>
        <div id='game'></div>
    </div>
    <script type='text/javascript'>
        EJS_player = '#game';

        // Can also be fceumm or nestopia
        EJS_core = 'nes';

        // URL to Famicom Disk System bios
        EJS_biosUrl = '';

        // URL to Game rom
        EJS_gameUrl = 'rom_fc/64-in-1_common.zip';

        // Path to the data directory
        EJS_pathtodata = '/emulatorjs/data/';

        // https://emulatorjs.org/docs/options
        EJS_fullscreenOnLoaded = true
        EJS_startOnLoaded = true
    </script>
    <script src='/emulatorjs/data/loader.js'></script>
   
</body>
</html>
